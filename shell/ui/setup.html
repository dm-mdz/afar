<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 Afar</title>
<!-- AFAR-008 "设置 Afar"窗口（界面稿 v3，中英双语）。状态由 Mac 端推过来（afar.update），按钮发指令给 Mac 端（send）。 -->
<style>
  /* 线稿风（2026-11-11 定稿，和 iPad App 同一套）：白底、黑色线条、只用一种黄色点缀；不分深浅色模式 */
  :root {
    color-scheme: light;
    --win: #ffffff; --card: #ffffff; --text: #111111; --sub: #6b6b6b; --line: #d9d9d4; --fill: #f4f4f1;
    --ink: #111111; --yellow: #ffe45c; --red: #d6331c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--win); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .wiz { padding: 18px 30px 22px; min-height: 100%; display: flex; flex-direction: column; }
  .wiz-hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .wiz h2 { margin: 4px 0 4px; font-size: 22px; font-weight: 900; letter-spacing: .01em; }
  .wiz > p { margin: 0 0 16px; color: var(--sub); font-size: 13.5px; }
  .lang-btn { font-size: 12px; font-weight: 700; color: var(--sub); border: 1.6px solid var(--line); border-radius: 8px; padding: 2px 8px; background: #fff; flex: none; margin-top: 6px; }
  .lang-btn:active { background: var(--yellow); border-color: var(--ink); color: var(--ink); }
  .grow { flex: 1; }
  .rows { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 11px; align-items: center; padding: 11px 13px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .d { color: var(--sub); font-size: 12.5px; margin-top: 1px; }
  .mark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
  .mark.ok { background: var(--ink); } .mark.todo { border: 2px solid var(--ink); }
  .mark.busy { border: 2px solid var(--ink); border-top-color: transparent; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .mark.busy { animation: none; } }
  .act { background: #fff; color: var(--ink); border: 1.8px solid var(--ink); border-radius: 8px; padding: 3px 11px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .act:active { background: var(--yellow); }
  .done { color: var(--ink); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .sub { grid-column: 2 / 4; margin-top: 2px; padding: 8px 10px; background: var(--fill); border-radius: 9px; font-size: 12.5px; display: grid; gap: 5px; }
  .sub div { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .sub button { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .big { width: 100%; margin-top: 14px; background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 3px 4px 0 var(--ink); padding: 8px 0; font-weight: 700; font-size: 14px; }
  .big:active { transform: translate(2px, 2px); box-shadow: 1px 2px 0 var(--ink); }
  .big[disabled] { opacity: .45; cursor: default; }
  .tip { margin-top: 8px; color: var(--sub); font-size: 12px; text-align: center; }
  .err { margin-top: 10px; padding: 7px 12px; border-radius: 9px; border: 1.8px solid var(--red); color: var(--red); font-size: 12.5px; }
  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #cfcfcf; }
  .dots i.on { width: 18px; border-radius: 3px; background: var(--ink); }
  .next { background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); border-radius: 9px; box-shadow: 2px 3px 0 var(--ink); padding: 5px 22px; font-weight: 700; }
  .next[disabled] { background: #fff; color: var(--sub); border-color: #bdbdb8; box-shadow: none; cursor: default; }
  .later, .back { color: var(--sub); font-size: 13px; margin-right: 14px; }
  .bigcode { font-size: 46px; font-weight: 700; letter-spacing: 6px; font-variant-numeric: tabular-nums; text-align: center; padding: 26px 0 8px; -webkit-user-select: text; user-select: text; }
  .waiting { text-align: center; color: var(--sub); font-size: 13.5px; display: flex; gap: 8px; align-items: center; justify-content: center; }
  .opt { display: block; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 11px 14px; margin-bottom: 10px; }
  .opt[aria-pressed="true"] { background: var(--yellow); box-shadow: 3px 4px 0 var(--ink); }
  .opt[aria-pressed="true"] span { color: var(--ink); }
  .opt b { font-size: 14.5px; } .opt span { display: block; color: var(--sub); font-size: 12.5px; margin-top: 2px; }
  .center { text-align: center; align-items: center; }
  .link { display: flex; align-items: center; justify-content: center; margin: 40px 0 22px; }
  .link .dev { width: 70px; height: 52px; border-radius: 12px; background: var(--card); border: 2.5px solid var(--ink); display: grid; place-items: center; font-size: 13px; color: var(--ink); font-weight: 700; }
  .link .dev.pad { width: 56px; height: 72px; background: var(--yellow); box-shadow: 3px 4px 0 var(--ink); }
  .link .wire { width: 70px; border-top: 3px solid var(--ink); margin: 0 8px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 12px; }
  .head h2 { margin: 0; font-size: 21px; font-weight: 900; }
  .code { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: 2px; -webkit-user-select: text; user-select: text; }
  .sum { display: grid; grid-template-columns: 22px 1fr auto; gap: 11px; align-items: center; padding: 11px 13px; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; margin-top: 10px; width: 100%; text-align: left; }
  .sum.open { border-radius: 12px 12px 0 0; }
  .sum .v { color: var(--sub); font-size: 12.5px; }
  .sum + .rows { border-radius: 0 0 12px 12px; border-top-width: 0; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--sub); font-size: 12px; }
  .foot-r { display: flex; align-items: center; gap: 12px; }
  .foot button { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .foot .lang-btn { margin-top: 0; text-decoration: none; color: var(--sub); }
  .timer { text-align: center; font-size: 13px; color: var(--sub); margin: 2px 0 14px; }
  .timer b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bigcode.off { color: #bdbdb8; }
  .ghost { background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 9px; padding: 4px 18px; font-weight: 700; }
  .sub small { color: var(--sub); font-size: 12px; }
  .sub .un { color: var(--red); }
  .dim { position: fixed; inset: 0; background: rgba(0,0,0,.18); display: grid; place-items: center; }
  .dlg { width: 300px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; box-shadow: 4px 5px 0 var(--ink); padding: 18px 18px 14px; text-align: center; }
  .dlg b { display: block; font-size: 14.5px; margin-bottom: 6px; }
  .dlg p { margin: 0 0 14px; color: var(--sub); font-size: 12.5px; }
  .dlg .bt { display: grid; gap: 8px; }
  .dlg .bt button { border: 2px solid var(--ink); border-radius: 9px; padding: 5px 0; font-weight: 700; }
  .dlg .bt .red { background: var(--red); border-color: var(--red); color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
// 状态（Mac 端推过来）和本页自己的状态
let V = null;
const P = { screen: null, open: {}, confirm: null };
const qpLang = (typeof location !== 'undefined' && location.search)
  ? new URLSearchParams(location.search).get('lang')
  : null;
const sysLang = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
let curZh = qpLang ? /^zh/i.test(qpLang) : /^zh\b/i.test(sysLang);
const T = (zh, en) => (curZh ? zh : en);
function syncDocLang() {
  document.documentElement.lang = curZh ? 'zh-CN' : 'en';
  document.title = T('设置 Afar', 'Set Up Afar');
}
syncDocLang();
const langBtn = () => `<button class="lang-btn" data-lang-toggle aria-label="Switch language">${curZh ? 'EN' : '中文'}</button>`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function send(cmd, extra) {
  try { window.webkit.messageHandlers.afar.postMessage(JSON.stringify(Object.assign({ cmd }, extra || {}))); } catch (_) { /* 在浏览器里预览时没有 Mac 端 */ }
}
function trSetupErr(s) {
  if (curZh || !s) return s || '';
  if (s === '配置失败') return 'Configuration failed';
  if (s === '脚本构造失败') return 'Failed to build setup script';
  if (s === '后台任务提交失败') return 'Failed to start background task';
  if (/[\u4e00-\u9fff]/.test(s)) return 'Setup failed — please try again';
  return s;
}
const mark = (v) => `<span class="mark ${v === 'busy' ? 'busy' : v ? 'ok' : 'todo'}">${v === true ? '✓' : ''}</span>`;
const dots = (n) => `<div class="dots">${[1, 2, 3, 4].map((i) => `<i class="${i === n ? 'on' : ''}"></i>`).join('')}</div>`;
// 一行：状态圈、标题、说明、右边（"好了"或按钮）
function row(ok, title, okText, todoText, btn, busy) {
  const v = busy ? 'busy' : ok;
  return `<div class="row">${mark(v)}<div><div>${esc(title)}</div><div class="d">${esc(busy ? T('正在处理…', 'Working…') : ok ? okText : todoText)}</div></div>
    <span>${ok ? `<span class="done">${T('好了', 'Done')}</span>` : busy ? '' : btn || ''}</span></div>`;
}
const openBtn = (what, text) => `<button class="act" data-open="${what}">${esc(text || T('打开设置', 'Open Settings'))}</button>`;
const oneDone = () => V.agent && V.fw && V.power;
function permRows() {
  const scOk = V.perm_sc !== false;
  const axOk = V.perm_ax !== false;
  return row(scOk, T('屏幕录制权限（日常模式）', 'Screen Recording (Daily Mode)'), T('已授权', 'Granted'), T('在「系统设置 → 隐私与安全性 → 屏幕录制」中勾选 Afar', 'Enable Afar in System Settings → Privacy & Security → Screen Recording'), openBtn('screen_capture'))
    + row(axOk, T('辅助功能权限（日常模式）', 'Accessibility (Daily Mode)'), T('已授权', 'Granted'), T('在「系统设置 → 隐私与安全性 → 辅助功能」中勾选 Afar', 'Enable Afar in System Settings → Privacy & Security → Accessibility'), openBtn('accessibility'));
}
// 断电恢复：所选方案要做的几行、还差几项
function recRows() {
  if (V.plan === 'fv') {
    return row(V.remote_login, T('远程登录', 'Remote Login'), T('已打开', 'Enabled'), T('iPad 靠它远程解锁磁盘', 'Used by iPad to unlock the disk remotely'), `<button class="act" data-cmd="ssh">${T('打开', 'Enable')}</button>`, V.busy === 'ssh');
  }
  return row(!V.filevault, T('关闭文件保险箱', 'Turn Off FileVault'), T('已关闭', 'Off'), T('开着时系统不允许自动登录', 'macOS blocks automatic login while FileVault is on'), openBtn('filevault'))
    + row(V.auto_login, T('自动登录', 'Automatic Login'), T('已打开', 'Enabled'), V.filevault ? T('关掉文件保险箱后才有这个选项', 'Available after turning off FileVault') : T('在"用户与群组"里选"自动以此身份登录"', 'Choose "Automatically log in as" in Users & Groups'), openBtn('users'));
}
const recLeft = () => (V.plan === 'fv' ? [V.remote_login] : [!V.filevault, V.auto_login]).filter((x) => !x).length;
const errBox = () => (V.error && V.error !== '取消了' ? `<div class="err">${esc(trSetupErr(V.error))}</div>` : '');
const ipadRow = () => (V.ipad
  ? row(true, T('找到你的 iPad', 'Find Your iPad'), T('已找到：', 'Found: ') + V.ipad, '')
  : `<div class="row">${mark(false)}<div><div>${T('找到你的 iPad', 'Find Your iPad')}</div><div class="d">${T('附近没找到。Mac 和 iPad 上都确认下面几项：', 'Not found nearby. Check these on both Mac and iPad:')}</div></div><span></span>
      <div class="sub">
        <div><span>${T('蓝牙打开', 'Bluetooth enabled')}</span>${openBtn('bluetooth')}</div>
        <div><span>${T('无线局域网打开，连同一个网络', 'Wi-Fi enabled on the same network')}</span>${openBtn('wifi')}</div>
        <div><span>${T('接力打开（隔空投送与连续互通）', 'Handoff enabled (AirDrop & Handoff)')}</span>${openBtn('handoff')}</div>
        <div><span>${T('两台登的是同一个 Apple 账户', 'Same Apple Account on both devices')}</span><span>${T('对照两台"设置"最上方', 'Check top of Settings')}</span></div>
        <div><span>${T('iPad 已解锁、离 Mac 不远', 'iPad unlocked and nearby')}</span><span></span></div>
      </div></div>`);

// 配对页（向导第 2 屏和菜单栏"配对新 iPad…"共用）。只有这一页开着的 10 分钟里 Mac 才接受配对（v0.4.8）。
const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function pairBody() {
  if (V.pair_done) {
    return `<div class="bigcode">✓</div>
      <div class="waiting">${T(`"${esc(V.pair_done)}"已配对`, `"${esc(V.pair_done)}" paired`)}</div>
      <p style="text-align:center;color:var(--sub);font-size:12.5px;margin-top:14px">${T('iPad 上还要输一次这台 Mac 的登录密码，在 iPad 上完成。', 'Finish setup on your iPad by entering your Mac login password once.')}</p>`;
  }
  if (!V.pair_left) {
    return `<div class="bigcode off">——</div>
      <div class="timer">${T('配对已停止', 'Pairing stopped')}</div>
      <div style="text-align:center"><button class="ghost" data-cmd="pair_open">${T('重新开始配对', 'Start Pairing Again')}</button></div>`;
  }
  const code = V.code ? V.code.slice(0, 3) + ' ' + V.code.slice(3) : '——';
  return `<div class="bigcode${V.pair_lock ? ' off' : ''}">${esc(code)}</div>
      <div class="timer">${V.pair_lock
        ? T(`试错次数太多，暂停配对 <b>${mmss(V.pair_lock)}</b>，到时间后用上面这个新配对码`, `Too many attempts — paused for <b>${mmss(V.pair_lock)}</b>, then use the new code above`)
        : T(`配对还开着 <b>${mmss(V.pair_left)}</b>，到时间自动停止`, `Pairing stays open for <b>${mmss(V.pair_left)}</b>, then closes automatically`)}</div>
      <div class="waiting">${mark('busy')} ${T('正在等 iPad…', 'Waiting for iPad…')}</div>
      <p style="text-align:center;color:var(--sub);font-size:12.5px;margin-top:14px">${T('配对码用过就换。iPad 上还要输一次这台 Mac 的登录密码，在 iPad 上完成。', 'The code rotates after each pairing. You will enter your Mac login password once on iPad to finish.')}</p>`;
}
// 状态页：已配对的 iPad，每台都能取消配对
function devRow() {
  if (!V.paired) return row(false, T('已配对的 iPad', 'Paired iPads'), '', T('还没配对', 'Not paired yet'), `<button class="act" data-go="pair">${T('配对', 'Pair')}</button>`);
  const list = V.devices.map((d) => `<div><span><b>${esc(d.name)}</b> <small>· ${T(`${esc(d.date)}配对`, `Paired ${esc(d.date)}`)}${d.showing ? T(' · 正在显示', ' · Showing') : ''}</small></span>
      <button class="un" data-unpair="${esc(d.id)}">${T('取消配对', 'Unpair')}</button></div>`).join('');
  return `<div class="row">${mark(true)}<div><div>${T('已配对的 iPad', 'Paired iPads')}</div><div class="d">${T(`${V.paired} 台`, `${V.paired} paired`)}</div></div><span></span>
      <div class="sub">${list}<div><button data-go="pair">${T('配对新 iPad…', 'Pair New iPad…')}</button><span></span></div></div></div>`;
}
function confirmBox() {
  const c = P.confirm;
  if (!c) return '';
  return `<div class="dim"><div class="dlg" role="alertdialog"><b>${T(`取消配对"${esc(c.name)}"？`, `Unpair "${esc(c.name)}"?`)}</b>
      <p>${T('这台 iPad 上的 Afar 之后要重新输配对码才能再连这台 Mac。正在显示的话会先断开。', 'That iPad will need to enter a new pairing code to reconnect. If currently showing, Sidecar will disconnect first.')}</p>
      <div class="bt"><button class="red" data-unpair-yes>${T('取消配对', 'Unpair')}</button><button data-unpair-no>${T('不了', 'Cancel')}</button></div></div></div>`;
}

const SCREENS = {
  w1: () => `<div class="wiz">
      <div class="wiz-hd"><h2>${T('先让这台 Mac 准备好', 'Prepare This Mac')}</h2>${langBtn()}</div>
      <p>${T('下面 3 项点一次按钮、输一次这台 Mac 的登录密码就全部做好。', 'Click once and enter your Mac login password to configure all 3 items below.')}</p>
      <div class="rows">
        ${row(V.agent, T('开机自动启动 Afar', 'Launch Afar at Login'), T('已安装，正在运行', 'Installed and running'), T('还没安装：请从"应用程序"里打开 Afar', 'Not installed: open Afar from Applications'))}
        ${row(V.fw, T('允许 iPad 连进来', 'Allow Incoming iPad Connections'), T('防火墙已放行 Afar', 'Allowed in Firewall'), T('防火墙会拦住 iPad', 'Firewall may block your iPad'), '', V.busy === 'one' && !V.fw)}
        ${row(V.power, T('断电后自动开机', 'Auto-Start After Power Failure'), T('已打开', 'Enabled'), T('来电后要有人按电源键', 'Requires pressing the power button after an outage'), '', V.busy === 'one' && !V.power)}
      </div>
      ${oneDone() ? '' : `<button class="big" data-cmd="one" ${V.busy ? 'disabled' : ''}>${V.busy === 'one' ? T('正在配置…', 'Configuring…') : T('一键配置', 'Configure Automatically')}</button>
        <div class="tip">${T('会弹出系统的密码框，输入这台 Mac 的登录密码（Afar 拿不到这个密码）', 'macOS will ask for your administrator password (Afar never sees it)')}</div>`}
      ${errBox()}
      <div class="rows" style="margin-top:14px">${ipadRow()}${permRows()}</div>
      <div class="grow"></div>
      <div class="nav">${dots(1)}<span><button class="next" data-go="w2" ${oneDone() && V.ipad ? '' : 'disabled'}>${T('下一步', 'Next')}</button></span></div>
    </div>`,
  w2: () => `<div class="wiz">
      <div class="wiz-hd"><h2>${T('在 iPad 上输入配对码', 'Enter Code on Your iPad')}</h2>${langBtn()}</div>
      <p>${T(`在 iPad 上打开 Afar，选"${esc(V.name)}"，输入下面的数字。`, `Open Afar on your iPad, choose "${esc(V.name)}", and enter the digits below.`)}</p>
      ${pairBody()}
      <div class="grow"></div>
      <div class="nav">${dots(2)}<span><button class="back" data-go="w1">${T('上一步', 'Back')}</button><button class="next" data-go="w3" ${V.paired ? '' : 'disabled'}>${T('下一步', 'Next')}</button></span></div>
    </div>`,
  pair: () => `<div class="wiz">
      <div class="wiz-hd"><h2>${T('配对新 iPad', 'Pair New iPad')}</h2>${langBtn()}</div>
      <p>${T(`在 iPad 上打开 Afar，选"${esc(V.name)}"，输入下面的数字。`, `Open Afar on your iPad, choose "${esc(V.name)}", and enter the digits below.`)}</p>
      ${pairBody()}
      <div class="grow"></div>
      <div class="nav"><span></span>${V.pair_done
        ? `<button class="next" data-go="${V.done ? 'status' : 'w1'}">${T('好', 'Done')}</button>`
        : V.pair_left
          ? `<button class="ghost" data-go="${V.done ? 'status' : 'w1'}">${T('停止配对', 'Stop Pairing')}</button>`
          : `<span><button class="back" data-go="${V.done ? 'status' : 'w1'}">${T('返回', 'Back')}</button></span>`}</div>
    </div>`,
  w3: () => `<div class="wiz">
      <div class="wiz-hd"><h2>${T('断电后怎么恢复？', 'Power Outage Recovery')}</h2>${langBtn()}</div>
      <p>${T('选一种。现在不想弄可以先跳过，不影响使用。', 'Choose an option. You can skip this for now and configure it anytime.')}</p>
      <button class="opt" aria-pressed="${V.plan === 'auto'}" data-plan="auto"><b>${T('来电后自己进桌面（推荐放在家里的 Mac）', 'Boot Straight to Desktop (Recommended for Home Macs)')}</b><span>${T('不用碰 Mac，iPad 自动连上。代价：Mac 被拿走时硬盘数据不加密。', 'Zero-touch recovery — iPad reconnects automatically. Trade-off: drive is unencrypted if physically stolen.')}</span></button>
      <button class="opt" aria-pressed="${V.plan === 'fv'}" data-plan="fv"><b>${T('保持文件保险箱', 'Keep FileVault Enabled')}</b><span>${T('来电后在 iPad 上点一下解锁磁盘，再到 Mac 前登录一次。', 'Unlock the disk remotely from iPad after an outage, then sign in once on your Mac.')}</span></button>
      <div class="rows">${recRows()}</div>
      ${V.plan === 'fv' ? '' : `<div class="tip">${T('文件保险箱、自动登录是安全设置，按钮只带你到那一页，由你本人点。', 'FileVault and Automatic Login are security settings — the buttons open the right System Settings pane for you.')}</div>`}
      ${V.busy ? '' : errBox()}
      <div class="grow"></div>
      <div class="nav">${dots(3)}<span><button class="later" data-go="w4">${T('以后再说', 'Later')}</button><button class="next" data-go="w4" ${recLeft() ? 'disabled' : ''}>${T('完成', 'Finish')}</button></span></div>
    </div>`,
  w4: () => `<div class="wiz center">
      <div style="width:100%;display:flex;justify-content:flex-end">${langBtn()}</div>
      <div class="link"><div class="dev">Mac</div><div class="wire"></div><div class="dev pad">iPad</div></div>
      <h2>${T('可以用了', 'All Set')}</h2><p style="max-width:340px">${T('在 iPad 上点一下卡片，就显示这台 Mac 的桌面。', 'Tap this Mac on your iPad to display its desktop.')}${recLeft()
        ? T(`<br>断电恢复还差 ${recLeft()} 项，随时从菜单栏"检查并配置…"补上。`, `<br>${recLeft()} power recovery item(s) left — finish anytime from "Check & Configure…" in the menu bar.`)
        : V.plan === 'fv'
          ? T('<br>断电来电后：在 iPad 上点一下解锁磁盘，再到 Mac 前登录一次。', '<br>After a power outage: unlock the disk from iPad, then sign in once on your Mac.')
          : T('<br>断电来电后会自己进桌面，iPad 自动连上。', '<br>After a power outage: your Mac boots to desktop and reconnects to iPad automatically.')}</p>
      <div class="grow"></div>
      <div class="nav" style="width:100%">${dots(4)}<button class="next" data-cmd="done">${T('好', 'Done')}</button></div>
    </div>`,
  status: () => {
    const rec = recLeft();
    const conn = [V.agent, V.fw, V.power, !!V.ipad, V.paired > 0, V.perm_sc !== false, V.perm_ax !== false];
    const connLeft = conn.filter((x) => !x).length;
    const openConn = P.open.conn || connLeft > 0;
    const openRec = P.open.rec || rec > 0;
    const headText = connLeft
      ? T('还有 ' + connLeft + ' 项没好', connLeft + (connLeft === 1 ? ' Item Needs Setup' : ' Items Need Setup'))
      : rec
        ? T('可以用，断电恢复还差 ' + rec + ' 项', 'Ready · ' + rec + ' Power Recovery Item' + (rec === 1 ? '' : 's') + ' Left')
        : T('一切正常', 'Everything Looks Good');
    return `<div class="wiz">
      <div class="head"><h2>${headText}</h2></div>
      <button class="sum ${openConn ? 'open' : ''}" data-toggle="conn">${mark(!connLeft)}<b>${T('连上 iPad', 'iPad Connection')}</b><span class="v">${connLeft ? T('还差 ' + connLeft + ' 项', connLeft + ' left') : V.showing ? T('正在显示到 ', 'Showing on ') + esc(V.showing) : T('都好了', 'Ready')} ${openConn ? '⌃' : '⌄'}</span></button>
      ${openConn ? `<div class="rows">
        ${row(V.agent, T('开机自动启动 Afar', 'Launch Afar at Login'), T('正在运行', 'Running'), T('请从"应用程序"里打开 Afar', 'Open Afar from Applications'))}
        ${row(V.fw, T('允许 iPad 连进来', 'Allow Incoming iPad Connections'), T('防火墙已放行', 'Allowed in Firewall'), T('防火墙会拦住 iPad', 'Firewall may block your iPad'), `<button class="act" data-cmd="one">${T('修好', 'Fix')}</button>`, V.busy === 'one' && !V.fw)}
        ${row(V.power, T('断电后自动开机', 'Auto-Start After Power Failure'), T('已打开', 'Enabled'), T('来电后要有人按电源键', 'Requires power button after outage'), `<button class="act" data-cmd="one">${T('修好', 'Fix')}</button>`, V.busy === 'one' && !V.power)}
        ${permRows()}
        ${ipadRow()}
        ${devRow()}
      </div>` : ''}
      <button class="sum ${openRec ? 'open' : ''}" data-toggle="rec">${mark(!rec)}<b>${T('断电后自己恢复', 'Power Outage Recovery')}</b><span class="v">${rec ? T('还差 ' + rec + ' 项', rec + ' left') : V.plan === 'fv' ? T('来电后 iPad 解锁 + Mac 前登录', 'iPad Unlock + Mac Sign-In') : T('来电后自动进桌面', 'Auto-Boot to Desktop')} ${openRec ? '⌃' : '⌄'}</span></button>
      ${openRec ? `<div class="rows">${recRows()}</div><div class="tip"><button style="text-decoration:underline" data-go="w3">${T('换一种方案', 'Change Option')}</button></div>` : ''}
      ${errBox()}
      <div class="grow"></div>
      <div class="foot"><span>Afar ${esc(V.version)}</span><span class="foot-r">${langBtn()}<button data-cmd="again">${T('重新走一遍向导', 'Run Setup Wizard Again')}</button></span></div>
    </div>`;
  },
};

function render() {
  if (!V) return;
  if (!P.screen) P.screen = V.done ? 'status' : 'w1';
  document.getElementById('root').innerHTML = SCREENS[P.screen]() + confirmBox();
}
document.addEventListener('click', (e) => {
  const q = (a) => e.target.closest(`[${a}]`);
  let b;
  if (q('data-lang-toggle')) {
    curZh = !curZh;
    syncDocLang();
    send('lang', { lang: curZh ? 'zh' : 'en' });
  }
  else if ((b = q('data-unpair'))) P.confirm = { id: b.dataset.unpair, name: (V.devices.find((d) => d.id === b.dataset.unpair) || {}).name || 'iPad' };
  else if (q('data-unpair-yes')) { send('unpair', { id: P.confirm.id }); P.confirm = null; }
  else if (q('data-unpair-no')) P.confirm = null;
  else if ((b = q('data-go')) && !b.disabled) {
    const from = P.screen, to = b.dataset.go;
    const isPair = (s) => s === 'w2' || s === 'pair';
    if (isPair(from) && !isPair(to)) send('pair_close');
    if (isPair(to) && !isPair(from)) send('pair_open');
    P.screen = to;
  }
  else if ((b = q('data-toggle'))) P.open[b.dataset.toggle] = !P.open[b.dataset.toggle];
  else if ((b = q('data-open'))) return send('open', { what: b.dataset.open });
  else if ((b = q('data-plan'))) { V.plan = b.dataset.plan; send('plan', { plan: V.plan }); }
  else if ((b = q('data-cmd')) && !b.disabled) {
    const c = b.dataset.cmd;
    send(c);
    if (c === 'done') { V.done = true; P.screen = 'status'; }
    if (c === 'again') P.screen = 'w1';
    if (c === 'one' || c === 'ssh') V.busy = c;
  } else return;
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (P.confirm) { P.confirm = null; render(); } else send('close');
});
window.afar = {
  setLang(lang) {
    if (!qpLang) {
      curZh = /^zh/i.test(String(lang || ''));
      syncDocLang();
      if (V) render();
    }
  },
  update(v) {
    V = v;
    // Mac 端要求跳页（菜单栏"配对新 iPad…"、点了新配对的通知）：跳过去后回 went
    if (V.go) {
      // 从配对页被带走（点了新配对的通知）：配对跟着停
      if (V.go !== 'pair' && (P.screen === 'w2' || P.screen === 'pair')) send('pair_close');
      if (V.go === 'pair') P.screen = 'pair';
      if (V.go === 'status') P.screen = V.done ? 'status' : 'w1';
      if (V.go === 'devices') { P.screen = 'status'; P.open.conn = true; }
      P.confirm = null;
      send('went');
    }
    render();
  },
};
send('ready');
</script>
</body>
</html>
