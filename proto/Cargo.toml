[package]
name = "afar-proto"
version = "0.4.10"
edition = "2021"
license = "MIT"
description = "Afar 通信协议：Mac 端和 iPad App 共用（数据结构、配对、HTTP 收发、客户端）"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spake2 = "0.4"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
